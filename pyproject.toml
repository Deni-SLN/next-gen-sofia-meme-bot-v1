[project]
name = "sofia-trade"
version = "1.0.0"
description = "Next Gent Sofia Trade v1 - Solana Meme Coin Intelligence & Trading Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.34.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/api/tests", "services/worker/tests"]
# `services` makes the worker importable as the package it is
# (`worker.main`), `services/api` makes the API importable as `app`. Both are
# required: the container sets the same two via PYTHONPATH.
pythonpath = ["services", "services/api"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends()` in a default argument is the documented FastAPI idiom.
# E501: long lines are enforced by the formatter instead of the linter.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated files.
"migrations/versions/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"