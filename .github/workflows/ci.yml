name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check services tools
      - name: Tests (API + worker)
        run: pytest -q
      - name: API contract (UI <-> backend)
        run: python tools/check_api_contract.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t sofia-trade:ci .
      - name: Validate compose file
        run: docker compose config -q
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
      - name: The image can import both packages
        # The worker died at import in the container because neither package
        # root was on sys.path. `docker compose config -q` never noticed,
        # because it only parses YAML.
        run: |
          docker run --rm --entrypoint python sofia-trade:ci -c \
            "import worker.main, app.main; print('imports ok')"
      - name: The worker starts and runs every job
        # Runtime evidence, not config validation: the process must exit 0.
        run: |
          docker run --rm \
            -e SOFIA_ENV=development \
            -e SOFIA_DATABASE_URL=sqlite:////tmp/w.db \
            -e SOFIA_AUTH_DISABLED=true \
            -e SOFIA_DEXSCREENER_BASE_URL=http://127.0.0.1:1 \
            -e SOFIA_SOLANA_RPC_URL=http://127.0.0.1:1 \
            -e SOFIA_WORKER_HEARTBEAT=/tmp/hb \
            sofia-trade:ci python -m worker.main --once
      - name: The worker refuses to start on a schema it cannot verify
        run: |
          set +e
          docker run --rm \
            -e SOFIA_ENV=production \
            -e SOFIA_DATABASE_URL=sqlite:////tmp/stale.db \
            -e SOFIA_WORKER_HEARTBEAT=/tmp/hb2 \
            sofia-trade:ci python -m worker.main --once
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "expected exit code 2 for an unverifiable schema, got $rc"
            exit 1
          fi
      - name: The API boots and serves health inside the image
        run: |
          docker run -d --name sofia-api \
            -e SOFIA_ENV=development \
            -e SOFIA_DATABASE_URL=sqlite:////tmp/api.db \
            -e SOFIA_AUTH_DISABLED=true \
            sofia-trade:ci
          for i in $(seq 1 30); do
            if docker run --rm --network container:sofia-api \
                python:3.12-slim python -c \
                "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).status==200 else 1)"; then
              echo "api healthy"
              docker rm -f sofia-api
              exit 0
            fi
            sleep 2
          done
          echo "api never became healthy"
          docker logs sofia-api
          docker rm -f sofia-api
          exit 1

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack and wait for a healthy API
        run: |
          export POSTGRES_PASSWORD='ci-only-not-a-secret'
          export SOFIA_ADMIN_PASSWORD='ci-only-not-a-secret'
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1; then
              echo "stack up"
              docker compose ps
              exit 0
            fi
            sleep 3
          done
          echo "stack never became healthy"
          docker compose logs
          exit 1
      - name: Worker reports a recent heartbeat
        run: |
          export POSTGRES_PASSWORD='ci-only-not-a-secret'
          export SOFIA_ADMIN_PASSWORD='ci-only-not-a-secret'
          docker compose ps worker
          docker inspect --format '{{.State.Health.Status}}' \
            "$(docker compose ps -q worker)"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
