server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: unknown paths must serve the app shell, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API traffic is proxied so the browser stays same-origin (no CORS preflight).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # correlation id must survive the proxy hop (PRD 12.6)
        proxy_pass_header X-Request-ID;
    }

    # Static assets are content-hashed and safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}